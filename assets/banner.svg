<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">.github</title>
  <desc id="d">The foundation's front step: how we work and how to join in. The picture: an arch of 7 stones lights from both sides inward until the keystone is reached. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f271b"/><stop offset="1" stop-color="#18181a"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#b45309"/><stop offset="0.50" stop-color="#d97706"/><stop offset="1.00" stop-color="#edbb70"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#d97706" stop-opacity="0"/><stop offset=".35" stop-color="#d97706"/><stop offset="1" stop-color="#edbb70"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <path d="M866.8 220A120 120 0 0 1 1106.8 220Z" fill="#513717" fill-opacity=".28"/>
    <path class="arrive" style="animation-delay:0.30s" d="M844.9 217.4A142 142 0 0 1 857.8 160.7" fill="none" stroke="#7b4b12" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.58s" d="M860.0 156.1A142 142 0 0 1 896.3 110.6" fill="none" stroke="#9a5a0e" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.86s" d="M900.3 107.4A142 142 0 0 1 952.7 82.2" fill="none" stroke="#ba680a" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.14s" d="M957.7 81.0A142 142 0 0 1 1015.9 81.0" fill="none" stroke="#edbb70" stroke-width="34"/>
    <path class="arrive" style="animation-delay:0.86s" d="M1020.9 82.2A142 142 0 0 1 1073.4 107.4" fill="none" stroke="#ba680a" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.58s" d="M1077.3 110.6A142 142 0 0 1 1113.6 156.1" fill="none" stroke="#9a5a0e" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.30s" d="M1115.9 160.7A142 142 0 0 1 1128.8 217.4" fill="none" stroke="#7b4b12" stroke-width="28"/>
    <circle class="halo" cx="986.8" cy="78.0" r="22" fill="none" stroke="#edbb70" stroke-width="2"/>
    <circle cx="942.9" cy="142.8" r="2.4" fill="#edbb70" opacity=".7"/>
    <circle cx="920.5" cy="182.1" r="1.7" fill="#edbb70" opacity=".7"/>
    <circle cx="1038.8" cy="164.4" r="2.8" fill="#edbb70" opacity=".7"/>
    <circle cx="1016.7" cy="192.1" r="1.8" fill="#edbb70" opacity=".7"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#6b4f1d"/><rect x="300.0" y="248" width="300.5" height="12" fill="#b45309"/><rect x="600.0" y="248" width="300.5" height="12" fill="#d97706"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fef3c7"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#d97706" font-size="15" font-weight="700" letter-spacing=".6">The Holy Earth Foundation</text><text x="56" y="122.2" fill="#fef3c7" font-size="60" font-weight="700" letter-spacing="-.5">.github</text><text x="56" y="166.0" fill="#e1d6af" font-size="23">The foundation's front step: how we work and how</text><text x="56" y="196.8" fill="#e1d6af" font-size="23">to join in.</text></g>
  </g>
</svg>
